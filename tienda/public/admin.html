<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Panel del dueño</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <span class="brand">Panel del dueño</span>
        <div>
          <a class="btn btn-sm" href="https://placerstudios.online">Estudio</a>
          <button type="button" class="btn btn-sm" id="btnLogout" hidden>Salir</button>
        </div>
      </div>
    </header>

    <main class="container" style="max-width:960px">
      <!-- Auth -->
      <section id="authSection">
        <div class="auth-shell">
          <h1 id="authTitle">Ingresar</h1>
          <form id="authForm">
            <div class="field" id="fieldDisplayName" hidden>
              <label for="displayName">Tu nombre</label>
              <input id="displayName" type="text" />
            </div>
            <div class="field">
              <label for="username">Usuario</label>
              <input id="username" type="text" required autocomplete="username" />
            </div>
            <div class="field">
              <label for="password">Contraseña</label>
              <input id="password" type="password" required autocomplete="current-password" />
            </div>
            <button type="submit" class="btn btn-accent btn-block" id="authSubmit">Ingresar</button>
            <p class="error-msg" id="authError" hidden></p>
          </form>
        </div>
      </section>

      <!-- Panel -->
      <section id="panelSection" hidden>
        <div class="tabnav">
          <button type="button" class="tab-btn active" data-tab="tabPersonas">Personas</button>
          <button type="button" class="tab-btn" data-tab="tabProductos">Productos</button>
          <button type="button" class="tab-btn" data-tab="tabNegocio">Negocio</button>
        </div>

        <div id="tabPersonas" class="panel active">
          <div class="card-box">
            <h2>Cierre de quincena</h2>
            <p class="muted" id="cierrePendiente"></p>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
              <button type="button" class="btn btn-accent" id="btnCerrarQuincena" hidden></button>
            </div>
            <div id="cierresLista"></div>
          </div>

          <div class="card-box" id="personaBox">
            <h2>Persona</h2>
            <div class="field"><label for="desprPersona">Elegir persona</label><select id="desprPersona"><option value="">Elegí una persona…</option></select></div>
            <div id="personaResumen" class="persona-estado"></div>
            <div id="desprLista"></div>
            <details class="consumo-det" id="consumoDet">
              <summary>Consumo (ver y anular)</summary>
              <div id="consumoLista"></div>
            </details>
            <details class="gestion">
              <summary>Datos y gestión de la persona</summary>
              <div id="personaAcciones" class="persona-botones"></div>
            </details>
          </div>

          <details class="card-box add-box" id="agregarPersonaBox">
            <summary class="btn">+ Agregar persona</summary>
            <form id="personaForm" class="row-inline" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
              <div class="field" style="margin-bottom:0;flex:1;min-width:160px"><label>Nombre</label><input id="personaNombre" required /></div>
              <div class="field" style="margin-bottom:0;width:100px"><label>PIN (3 díg.)</label><input id="personaPin" maxlength="4" pattern="[0-9]{3,4}" required /></div>
              <div style="align-self:flex-end"><button type="submit" class="btn btn-accent">Agregar</button></div>
            </form>
          </details>
        </div>

        <div id="tabProductos" class="panel">
          <div class="card-box">
            <h2>Productos</h2>
            <input id="productosBuscar" type="search" placeholder="Buscar producto…" aria-label="Buscar producto" class="buscador" />
            <div id="productosGrid" class="producto-grid admin-grid"></div>
            <p id="productosVacio" class="muted" hidden>No hay productos que coincidan.</p>
          </div>

          <details class="card-box add-box" id="agregarProductoBox">
            <summary class="btn">+ Agregar producto</summary>
            <form id="productoForm" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
              <div class="field" style="margin-bottom:0;flex:1;min-width:160px"><label>Nombre</label><input id="productoNombre" required /></div>
              <div class="field" style="margin-bottom:0;width:110px"><label>Precio</label><input id="productoPrecio" type="number" min="0" required /></div>
              <div class="field" style="margin-bottom:0;width:90px"><label>Stock</label><input id="productoStock" type="number" min="0" value="0" /></div>
              <div class="field" style="margin-bottom:0;flex:1;min-width:220px">
                <label>Foto (opcional)</label>
                <div class="upload-row">
                  <img id="productoFotoPreview" class="producto-foto" hidden />
                  <input id="productoFoto" type="hidden" />
                  <input id="productoFotoFile" type="file" accept="image/*" />
                </div>
              </div>
              <div style="align-self:flex-end"><button type="submit" class="btn btn-accent">Agregar</button></div>
            </form>
          </details>

        </div>

        <div id="tabNegocio" class="panel">
          <div class="card-box" style="max-width:420px">
            <h2>Datos del negocio</h2>
            <form id="negocioForm">
              <div class="field">
                <label for="negocioNombre">Nombre</label>
                <input id="negocioNombre" required />
              </div>
              <div class="field">
                <label for="negocioMoneda">Moneda</label>
                <input id="negocioMoneda" maxlength="3" />
              </div>
              <button type="submit" class="btn btn-accent">Guardar</button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <script src="/ui.js"></script>
    <script src="/admin.js"></script>
  </body>
</html>
